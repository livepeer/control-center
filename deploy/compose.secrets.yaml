# Deploy on independent infrastructure; do not join the Control Center network.
services:
  secrets:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.secrets
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ["8443:8443"]
    environment:
      SECRETS_LISTEN: ':8443'
      SECRETS_DATABASE_URL_FILE: /private/database-url
      SECRETS_SIGNING_KEY_FILE: /private/signing-key
      SECRETS_SIGNING_KEY_ID: '${SECRETS_SIGNING_KEY_ID:-1}'
      SECRETS_CA_FILE: /private/machine-ca.pem
      SECRETS_CA_KEY_FILE: /private/machine-ca-key.pem
      SECRETS_TLS_CERT_FILE: /private/tls.pem
      SECRETS_TLS_KEY_FILE: /private/tls-key.pem
      CONTROL_METADATA_TOKEN_FILE: /private/control-metadata-token
      VAULT_TOKEN_FILE: /private/vault-token
      VAULT_ADDR: '${VAULT_ADDR:?configure Vault HTTPS address}'
      CONTROL_API_URL: '${CONTROL_API_URL:?configure Control Center HTTPS origin}'
      SUPABASE_URL: '${SUPABASE_URL:?configure Auth origin}'
      SUPABASE_PUBLISHABLE_KEY: '${SUPABASE_PUBLISHABLE_KEY:?configure Auth publishable key}'
      SECRETS_ALLOWED_ORIGIN: '${SECRETS_ALLOWED_ORIGIN:?configure web UI origin}'
    volumes:
      - ./secrets-service-private:/private:ro
