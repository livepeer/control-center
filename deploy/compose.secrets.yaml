name: livepeer-secrets

x-service: &service
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  secrets:
    <<: *service
    build:
      context: ..
      dockerfile: deploy/Dockerfile.secrets
    ports:
      - 127.0.0.1:23812:8080
    environment:
      SECRETS_LISTEN: ':8080'
      SECRETS_PUBLIC_URL: '${SECRETS_PUBLIC_URL:?configure secrets service HTTPS origin}'
      SECRETS_DATABASE_URL_FILE: /private/database-url
      SECRETS_SIGNING_KEY_FILE: /private/signing-key
      SECRETS_IDENTITY_KEY_FILE: /private/identity-key.pem
      SECRETS_ENCRYPTION_KEY_FILE: /private/encryption-key.pem
      SECRETS_SIGNING_KEY_ID: '${SECRETS_SIGNING_KEY_ID:-1}'
      CONTROL_METADATA_TOKEN_FILE: /private/control-metadata-token
      VAULT_TOKEN_FILE: /private/vault-token
      VAULT_ADDR: http://vault:8200
      CONTROL_API_URL: '${CONTROL_API_URL:?configure Control Center HTTPS origin}'
      SUPABASE_URL: '${SUPABASE_URL:?configure Auth origin}'
      SUPABASE_PUBLISHABLE_KEY: '${SUPABASE_PUBLISHABLE_KEY:?configure Auth publishable key}'
      SECRETS_ALLOWED_ORIGIN: '${SECRETS_ALLOWED_ORIGIN:?configure web UI origin}'
    volumes:
      - ./secrets-service-private:/private:ro
    networks: [default, vault]
    depends_on:
      vault:
        condition: service_healthy

  vault:
    <<: *service
    # HashiCorp Vault 2.2.1.
    image: hashicorp/vault@sha256:962a92876e168d68eaaa24b0b8b49bbce1cb63024060a67bba95cd158a366fc2
    user: "65532:65532"
    entrypoint: [vault]
    command: [server, "-config=/vault/config/server.hcl"]
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    volumes:
      - ./vault.hcl:/vault/config/server.hcl:ro
      - ./vault-private/data:/vault/data
    networks: [vault]
    healthcheck:
      test: [CMD, vault, status]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

networks:
  default:
    enable_ipv6: true
  vault:
    internal: true
