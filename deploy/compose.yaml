name: controlcenter

x-service: &service
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  api:
    <<: *service
    image: controlcenter-api:staging
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    volumes:
      - ./config.toml:/etc/controlcenter/config.toml:ro
      - type: bind
        source: ./onchain.json
        target: /etc/controlcenter/onchain.json
        read_only: true
        bind:
          create_host_path: false
      - ./secrets/onchain-rpc:/run/onchain-rpc:ro
    secrets:
      - pg-connstr
      - pg-password
      - jwt-signing-key.pem
      - machine-token-secret
      - cloudflare-token
      - secrets-metadata-token
      - onchain-webhook-auth
    # PublicListen: the tunnel origin for controlcenter-api.livepeer.live.
    # Listen (43812) serves internal callbacks on the Compose networks only.
    ports:
      - 127.0.0.1:43811:43811
    # Probe the tunnel origin so a missing PublicListen keeps cloudflared down.
    # The API exits if either listener fails, so this also covers Listen.
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:43811/readyz]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    networks:
      default:
      secrets-control:
        aliases: [control-metadata]

  redeemer:
    <<: *service
    image: ${LIVEPEER_REDEEMER_IMAGE:?Set a digest-pinned compatible Node image}
    user: "65532:65532"
    command: [redeemer, --config, /etc/livepeer/redeemer.toml]
    volumes:
      - ./redeemer.toml:/etc/livepeer/redeemer.toml:ro
      - redeemer-data:/home/livepeer/.lpData
      - ./secrets/redeemer:/run/redeemer:ro
    stop_grace_period: 30s

  # Read-only public registry endpoint. Remove together with the registry
  # when the bundled registry is retired (naap-ops#124).
  registry-proxy:
    <<: *service
    image: caddy:2-alpine
    user: "65532:65532"
    environment:
      XDG_CONFIG_HOME: /tmp/config
      XDG_DATA_HOME: /tmp/data
    volumes:
      - ./Caddyfile.registry:/etc/caddy/Caddyfile:ro
    ports:
      - 127.0.0.1:53812:8082
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=0700
    depends_on:
      registry:
        condition: service_started
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8082/v2/]
      interval: 30s
      timeout: 5s
      retries: 3

  registry:
    <<: *service
    image: registry:3
    environment:
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
      REGISTRY_LOG_LEVEL: warn
    ports:
      - 127.0.0.1:63812:5000
    volumes:
      - registry-data:/var/lib/registry

  secrets:
    <<: *service
    build:
      context: ..
      dockerfile: deploy/Dockerfile.secrets
    env_file: ./secrets-service.env
    networks: [default, secrets-control]
    ports:
      - 127.0.0.1:23812:8080
    environment:
      SECRETS_LISTEN: ':8080'
      SECRETS_DATABASE_URL_FILE: /private/database-url
      SECRETS_SIGNING_KEY_FILE: /private/signing-key
      SECRETS_IDENTITY_KEY_FILE: /private/identity-key.pem
      SECRETS_ENCRYPTION_KEY_FILE: /private/encryption-key.pem
      SECRETS_CONTROL_TOKEN_FILE: /private/control-metadata-token
      SECRETS_VAULT_TOKEN_FILE: /private/vault-token
      SECRETS_VAULT_URL: https://vault:8200
      SSL_CERT_FILE: /private/ca-bundle.pem
    volumes:
      - ./secrets-service-private:/private:ro
    depends_on:
      vault:
        condition: service_healthy

  vault:
    <<: *service
    # HashiCorp Vault 2.2.1.
    image: hashicorp/vault@sha256:962a92876e168d68eaaa24b0b8b49bbce1cb63024060a67bba95cd158a366fc2
    user: "65532:65532"
    entrypoint: [vault]
    command: [server, "-config=/vault/config/server.hcl"]
    environment:
      VAULT_ADDR: https://127.0.0.1:8200
      VAULT_CACERT: /vault/tls/ca.pem
    ports:
      - 127.0.0.1:28200:8200
    volumes:
      - /opt/controlcenter-secrets/vault/config:/vault/config:ro
      - /opt/controlcenter-secrets/vault/tls:/vault/tls:ro
      - /opt/controlcenter-secrets/vault/data:/vault/data
    healthcheck:
      test: [CMD, vault, status]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  cloudflared:
    <<: *service
    image: cloudflare/cloudflared:2026.10.7
    user: "65532:65532"
    network_mode: host
    command: [tunnel, --no-autoupdate, --metrics, "127.0.0.1:23813", run]
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/cloudflare-tunnel-token
    secrets:
      - cloudflare-tunnel-token
    # Tunnel origins: API localhost:43811, secrets localhost:23812, registry
    # localhost:53812. The UI hostname is served by Cloudflare Workers.
    depends_on:
      api:
        condition: service_healthy
      registry-proxy:
        condition: service_healthy
    stop_grace_period: 30s

secrets:
  pg-connstr:
    file: ./secrets/pg-connstr
  pg-password:
    file: ./secrets/pg-password
  jwt-signing-key.pem:
    file: ./secrets/jwt-signing-key.pem
  machine-token-secret:
    file: ./secrets/machine-token-secret
  cloudflare-token:
    file: ./secrets/cloudflare-token
  cloudflare-tunnel-token:
    file: ./secrets/cloudflare-tunnel-token
  secrets-metadata-token:
    file: ./secrets-service-private/control-metadata-token
  onchain-webhook-auth:
    file: ./secrets/onchain-webhook-auth

volumes:
  registry-data:
  redeemer-data:

networks:
  secrets-control:
    internal: true
  default:
    enable_ipv6: true
