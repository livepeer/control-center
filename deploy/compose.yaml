name: controlcenter

x-service: &service
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  api:
    <<: *service
    image: controlcenter-api:staging
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    volumes:
      - ./config.toml:/etc/controlcenter/config.toml:ro
      - type: bind
        source: ./onchain.json
        target: /etc/controlcenter/onchain.json
        read_only: true
        bind:
          create_host_path: false
      - ./secrets/onchain-rpc:/run/onchain-rpc:ro
    secrets:
      - pg-connstr
      - pg-password
      - jwt-signing-key.pem
      - machine-token-secret
      - cloudflare-token
      - secrets-metadata-token
      - onchain-webhook-auth
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:43812/readyz]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    networks:
      default:
      secrets-control:
        aliases: [control-metadata]
      telemetry:

  redeemer:
    <<: *service
    image: ${LIVEPEER_REDEEMER_IMAGE:?Set a digest-pinned compatible Node image}
    user: "65532:65532"
    command: [redeemer, --config, /etc/livepeer/redeemer.toml]
    volumes:
      - ./redeemer.toml:/etc/livepeer/redeemer.toml:ro
      - redeemer-data:/home/livepeer/.lpData
      - ./secrets/redeemer:/run/redeemer:ro
    stop_grace_period: 30s

  web:
    <<: *service
    image: controlcenter-web:staging
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    volumes:
      - type: bind
        source: ./bootstrap
        target: /srv/bootstrap
        read_only: true
        bind:
          create_host_path: false
    ports:
      - 127.0.0.1:33812:8080
      - 127.0.0.1:43812:8081
      - 127.0.0.1:53812:8082
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=0700
    depends_on:
      api:
        condition: service_healthy
      registry:
        condition: service_started
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/]
      interval: 30s
      timeout: 5s
      retries: 3

  registry:
    <<: *service
    image: registry:3
    environment:
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
      REGISTRY_LOG_LEVEL: warn
    ports:
      - 127.0.0.1:63812:5000
    volumes:
      - registry-data:/var/lib/registry

  secrets:
    <<: *service
    build:
      context: ..
      dockerfile: deploy/Dockerfile.secrets
    env_file: ./secrets-service.env
    networks: [default, secrets-control]
    ports:
      - 127.0.0.1:23812:8080
    environment:
      SECRETS_LISTEN: ':8080'
      SECRETS_DATABASE_URL_FILE: /private/database-url
      SECRETS_SIGNING_KEY_FILE: /private/signing-key
      SECRETS_IDENTITY_KEY_FILE: /private/identity-key.pem
      SECRETS_ENCRYPTION_KEY_FILE: /private/encryption-key.pem
      SECRETS_CONTROL_TOKEN_FILE: /private/control-metadata-token
      SECRETS_VAULT_TOKEN_FILE: /private/vault-token
      SECRETS_VAULT_URL: https://vault:8200
      SSL_CERT_FILE: /private/ca-bundle.pem
    volumes:
      - ./secrets-service-private:/private:ro
    depends_on:
      vault:
        condition: service_healthy

  vault:
    <<: *service
    # HashiCorp Vault 2.2.1.
    image: hashicorp/vault@sha256:962a92876e168d68eaaa24b0b8b49bbce1cb63024060a67bba95cd158a366fc2
    user: "65532:65532"
    entrypoint: [vault]
    command: [server, "-config=/vault/config/server.hcl"]
    environment:
      VAULT_ADDR: https://127.0.0.1:8200
      VAULT_CACERT: /vault/tls/ca.pem
    ports:
      - 127.0.0.1:28200:8200
    volumes:
      - /opt/controlcenter-secrets/vault/config:/vault/config:ro
      - /opt/controlcenter-secrets/vault/tls:/vault/tls:ro
      - /opt/controlcenter-secrets/vault/data:/vault/data
    healthcheck:
      test: [CMD, vault, status]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Machine telemetry storage. Only the API writes, through its authenticated
  # ingest endpoints; only Grafana and the API reach these stores.
  victoriametrics:
    <<: *service
    # VictoriaMetrics v1.155.0 single-node.
    image: victoriametrics/victoria-metrics:v1.155.0@sha256:f60dc268b54ecf87f6e09d740c2b732838aa9193090cc741417c9f6386a130df
    user: "65532:65532"
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=${TELEMETRY_METRICS_RETENTION:-30d}
      - -httpListenAddr=:8428
      - -selfScrapeInterval=30s
      - -promscrape.config=/etc/victoriametrics/scrape.yaml
    volumes:
      - /opt/controlcenter-telemetry/victoriametrics:/storage
      - ./victoriametrics-scrape.yaml:/etc/victoriametrics/scrape.yaml:ro
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=0700
    networks: [telemetry]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8428/health]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 30s

  victorialogs:
    <<: *service
    # VictoriaLogs v1.53.0 single-node.
    image: victoriametrics/victoria-logs:v1.53.0@sha256:251121fa882af99b95ba0c230a4a2f412ea602d2698c64a96c58dc9842bb755d
    user: "65532:65532"
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=${TELEMETRY_LOGS_RETENTION:-14d}
      - -retention.maxDiskSpaceUsageBytes=${TELEMETRY_LOGS_MAX_DISK:-50GiB}
      - -httpListenAddr=:9428
    volumes:
      - /opt/controlcenter-telemetry/victorialogs:/storage
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=0700
    networks: [telemetry]
    stop_grace_period: 30s

  grafana:
    <<: *service
    image: controlcenter-grafana:staging
    build:
      context: ..
      dockerfile: deploy/Dockerfile.grafana
    user: "65532:65532"
    # Fails closed until the Cloudflare Access application exists; see README.
    environment:
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      GRAFANA_ROOT_URL: ${GRAFANA_ROOT_URL:-https://controlcenter-grafana.livepeer.live}
    volumes:
      - /opt/controlcenter-telemetry/grafana:/var/lib/grafana
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=0700
    # The default network supplies egress for Cloudflare Access signing keys.
    networks: [default, telemetry]
    ports:
      - 127.0.0.1:13812:3000
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/api/health]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  cloudflared:
    <<: *service
    image: cloudflare/cloudflared:2026.10.7
    user: "65532:65532"
    network_mode: host
    command: [tunnel, --no-autoupdate, --metrics, "127.0.0.1:23813", run]
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/cloudflare-tunnel-token
    secrets:
      - cloudflare-tunnel-token
    depends_on:
      web:
        condition: service_healthy
    stop_grace_period: 30s

secrets:
  pg-connstr:
    file: ./secrets/pg-connstr
  pg-password:
    file: ./secrets/pg-password
  jwt-signing-key.pem:
    file: ./secrets/jwt-signing-key.pem
  machine-token-secret:
    file: ./secrets/machine-token-secret
  cloudflare-token:
    file: ./secrets/cloudflare-token
  cloudflare-tunnel-token:
    file: ./secrets/cloudflare-tunnel-token
  secrets-metadata-token:
    file: ./secrets-service-private/control-metadata-token
  onchain-webhook-auth:
    file: ./secrets/onchain-webhook-auth

volumes:
  registry-data:
  redeemer-data:

networks:
  secrets-control:
    internal: true
  telemetry:
    internal: true
  default:
    enable_ipv6: true
