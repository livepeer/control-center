# Shared-host staging: combine with compose.secrets.yaml, using the existing
# host-networked Control Center tunnel instead of another connector.
services:
  secrets:
    ports:
      - 127.0.0.1:23812:8080
    environment:
      SSL_CERT_FILE: /private/ca-bundle.pem
    depends_on:
      vault:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  cloudflared:
    profiles: [separate-tunnel]

  vault:
    # HashiCorp Vault 2.2.1.
    image: hashicorp/vault@sha256:962a92876e168d68eaaa24b0b8b49bbce1cb63024060a67bba95cd158a366fc2
    user: "65532:65532"
    entrypoint: [vault]
    command: [server, "-config=/vault/config/server.hcl"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      VAULT_ADDR: https://127.0.0.1:8200
      VAULT_CACERT: /vault/tls/ca.pem
    ports:
      - 127.0.0.1:28200:8200
    volumes:
      - ./vault.hcl:/vault/config/server.hcl:ro
      - ${VAULT_STATE_DIR:-./vault-private}/tls:/vault/tls:ro
      - ${VAULT_STATE_DIR:-./vault-private}/data:/vault/data
    healthcheck:
      test: [CMD, vault, status]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
