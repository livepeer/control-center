# Copy to config.toml. Paths are inside the API container, not the host.
PGConnstrFile = "/run/secrets/pg-connstr"
PGPasswordFile = "/run/secrets/pg-password"
JWTSigningPrivateKeyFile = "/run/secrets/jwt-signing-key.pem"
# Keep old key IDs and keys in this JSON file for one-hour grants and 24-hour invitations.
# JWTSigningKeyID = "2"
# JWTVerificationPublicKeysFile = "/private/jwt-verification-public-keys.json"
MachineTokenSecretFile = "/run/secrets/machine-token-secret"
SupabaseURL = "https://PROJECT.supabase.co"
SupabasePublishableKey = "replace-with-publishable-key"
DefaultAdminEmail = "admin@example.com"

Listen = "0.0.0.0:43812"
PublicAPIURL = "https://controlcenter-api.livepeer.live"
ConfigReconcileInterval = "1m"

# Publish both images to the bundled registry and use the returned digests.
RuntimeImage = "controlcenter-registry.livepeer.live/controlcenter/runtime@sha256:<RUNTIME_DIGEST>"
RuntimeConnectorImage = "controlcenter-registry.livepeer.live/controlcenter/connector@sha256:<CONNECTOR_DIGEST>"
RuntimeNodeImage = "controlcenter-registry.livepeer.live/controlcenter/node@sha256:<NODE_DIGEST>"
RuntimeNodeDrainTimeout = "12h"

# Enable after supplying account settings, the private keyring, and fleet IPs.
CloudflareEnabled = false
CloudflareIngressApproved = false
DiscoveryEnabled = false
CloudflareAccountID = "<ACCOUNT_ID>"
CloudflareZoneID = "<ZONE_ID>"
CloudflareBaseDomain = "livepeer.vip"
CloudflareAPITokenFile = "/run/secrets/cloudflare-token"
TunnelStatusTTL = "10m"
TunnelDrainTimeout = "10m"
TunnelNodeAddresses = ["<FLEET_NODE_IP/CIDR>"]
DiscoveryRefreshInterval = "5m"
DiscoveryMaxFailedRefreshes = 6

# Machine telemetry is on by default. The URLs name the private compose
# services; see docs/telemetry.md. Set false to stop ingest fleet-wide.
TelemetryEnabled = true
TelemetryMetricsURL = "http://victoriametrics:8428"
TelemetryLogsURL = "http://victorialogs:9428"
# Set false to keep app container output on machines.
TelemetryAppLogsEnabled = true

OnchainConfigFile = "/etc/controlcenter/onchain.json"
OnchainSecretsDir = "/run/onchain-rpc"
OnchainWebhookSecretFile = "/run/secrets/onchain-webhook-auth"

# Independent operator secrets service; see docs/operator-secrets.md.
SecretsURL = "https://controlcenter-secrets.livepeer.live"
SecretsMetadataTokenFile = "/run/secrets/secrets-metadata-token"
