name: Package

on:
  workflow_call:
    inputs:
      commit:
        description: Commit to package; defaults to the workflow commit
        type: string
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Linux ${{ matrix.arch }} / ${{ matrix.image.name }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image:
          - name: api
            file: deploy/Dockerfile
            target: api
          - name: web
            file: deploy/Dockerfile
            target: web
          - name: runtime
            file: runtime/Dockerfile
            target: ''
          - name: secrets
            file: deploy/Dockerfile.secrets
            target: ''
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      COMMIT: ${{ inputs.commit || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false
      - name: Resolve source revision
        id: source
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: controlcenter-${{ matrix.image.name }}:test-${{ matrix.arch }}
          build-args: |
            VERSION=${{ steps.source.outputs.revision }}
            COMMIT=${{ steps.source.outputs.revision }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
          cache-from: type=gha,scope=docker-${{ matrix.image.name }}-${{ matrix.arch }}
          cache-to: type=gha,scope=docker-${{ matrix.image.name }}-${{ matrix.arch }},mode=max
