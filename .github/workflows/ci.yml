name: Check and test code

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GOTOOLCHAIN: local
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            echo "$unformatted"
            echo 'Run go fmt ./... to fix formatting.' >&2
            exit 1
          fi
      - name: Node fixture paths
        run: |
          {
            echo "LIVEPEER_NODE_TEST_BINARY=$RUNNER_TEMP/bin/livepeer-orchestrator"
            echo "NODE_BINARY=$RUNNER_TEMP/bin/livepeer-orchestrator"
            echo "TRAEFIK_BINARY=$RUNNER_TEMP/bin/traefik"
            echo "CLOUDFLARED_BINARY=$RUNNER_TEMP/bin/cloudflared"
            echo "VICTORIAMETRICS_BINARY=$RUNNER_TEMP/bin/victoria-metrics-prod"
            echo "VICTORIALOGS_BINARY=$RUNNER_TEMP/bin/victoria-logs-prod"
            echo "VMAGENT_BINARY=$RUNNER_TEMP/bin/vmagent-prod"
          } >> "$GITHUB_ENV"
      - name: Install pinned Livepeer Node fixture
        run: |
          node_version=$(python3 tools/upgrade-node.py --check-source)
          GOBIN="$RUNNER_TEMP/bin" go install "github.com/livepeer/node/cmd/livepeer-orchestrator@$node_version"
      - name: Pin cloudflared fixture
        run: |
          curl --fail --location --retry 3 \
            https://github.com/cloudflare/cloudflared/releases/download/2026.10.7/cloudflared-linux-amd64 \
            --output "$CLOUDFLARED_BINARY"
          echo "1f99fb518b83dec2ba8d870a7cc991d82a77e6196295a3d2754ba17ab9f91872  $CLOUDFLARED_BINARY" | sha256sum --check
          chmod +x "$CLOUDFLARED_BINARY"
      - name: Pin bundled Traefik fixture
        run: |
          curl --fail --location --retry 3 \
            https://github.com/traefik/traefik/releases/download/v3.7.15/traefik_v3.7.15_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/traefik.tar.gz"
          echo "5b9f51199fcb7a3b5f7ae0f9dae8dcf01efadafd92c5fca96ea2822eca81f8e6  $RUNNER_TEMP/traefik.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/traefik.tar.gz" -C "$RUNNER_TEMP/bin" traefik
      - name: Pin telemetry storage fixtures
        run: |
          curl --fail --location --retry 3 \
            https://github.com/VictoriaMetrics/VictoriaMetrics/releases/download/v1.155.0/victoria-metrics-linux-amd64-v1.155.0.tar.gz \
            --output "$RUNNER_TEMP/victoria-metrics.tar.gz"
          echo "7180e65913d55ab99c0be8f4a3ad17a0fafe5598a21ff6327fecba3190d7b176  $RUNNER_TEMP/victoria-metrics.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/victoria-metrics.tar.gz" -C "$RUNNER_TEMP/bin" victoria-metrics-prod
          curl --fail --location --retry 3 \
            https://github.com/VictoriaMetrics/VictoriaLogs/releases/download/v1.53.0/victoria-logs-linux-amd64-v1.53.0.tar.gz \
            --output "$RUNNER_TEMP/victoria-logs.tar.gz"
          echo "55feba89713cafa952673f91b8b38e7701bb0290989263da671b47a0de16edd3  $RUNNER_TEMP/victoria-logs.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/victoria-logs.tar.gz" -C "$RUNNER_TEMP/bin" victoria-logs-prod
          curl --fail --location --retry 3 \
            https://github.com/VictoriaMetrics/VictoriaMetrics/releases/download/v1.155.0/vmutils-linux-amd64-v1.155.0.tar.gz \
            --output "$RUNNER_TEMP/vmutils.tar.gz"
          echo "b6181fc16cf19835706ea5d67215eea56c1fe87350fdfd82a5ff803ea2c1a907  $RUNNER_TEMP/vmutils.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/vmutils.tar.gz" -C "$RUNNER_TEMP/bin" vmagent-prod
      - name: Race and real-process tests
        run: |
          mkdir -p "${{ runner.temp }}/livepeer-test-artifacts"
          go test -race -artifacts -outputdir=${{ runner.temp }}/livepeer-test-artifacts ./...
      - name: Save test artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-artifacts
          overwrite: true
          path: ${{ runner.temp }}/livepeer-test-artifacts
          if-no-files-found: ignore
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          staticcheck ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

  ui:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Build UI
        run: npm run build
      - name: Edge Worker tests
        run: npm run test:worker
      - name: Validate edge deployment
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler deploy --env-file /dev/null --dry-run --env production --outdir "$RUNNER_TEMP/wrangler-dry-run"
      - name: Install Chrome
        run: npx playwright install --with-deps chrome
      - name: Browser tests
        run: npm run test:browser
      - name: Save browser test artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-artifacts
          path: |
            ui/test-results
            ui/playwright-report
          if-no-files-found: ignore

  runtime:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Runtime test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck jq
      - name: Bootstrap release and remote runner tests
        run: python3 -m unittest discover -s tools/tests -v
      - name: Runtime tests
        env:
          LIVEPEER_TEST_STATE_DIR: ${{ runner.temp }}/runtime-test-artifacts
        run: |
          mkdir -p "$LIVEPEER_TEST_STATE_DIR"
          bash runtime/tests/run.sh
      - name: Save Runtime test artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-test-artifacts
          path: ${{ runner.temp }}/runtime-test-artifacts
          if-no-files-found: ignore
