apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- suc-crd.yaml
- suc.yaml
patches:
- target:
    kind: ConfigMap
    name: default-controller-env
  patch: |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: default-controller-env
      namespace: system-upgrade
    data:
      SYSTEM_UPGRADE_JOB_KUBECTL_IMAGE: rancher/kubectl:v1.36.2
