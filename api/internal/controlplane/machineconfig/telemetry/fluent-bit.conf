# Records reach Control Center as JSON lines with "time" and "message". The
# source field is system, app, host or event; namespace, pod and container
# identify workload output. Control Center adds node_id and orchestrator.
[SERVICE]
    flush                     5
    log_level                 warn
    parsers_file              /etc/telemetry/parsers.conf
    http_server               on
    http_listen               127.0.0.1
    http_port                 20245
    # Buffers and tail positions are per enrollment, so a backlog is never
    # sent as another identity.
    storage.path              /buffer/@NODE_ID@
    storage.sync              normal
    storage.max_chunks_up     32
    storage.backlog.mem_limit 8M

[INPUT]
    name                tail
    tag                 pod.system
    path                @INSTALL_DIR@/logs/pods/*/*/*.log
    exclude_path        @INSTALL_DIR@/logs/pods/livepeer-apps_*/*/*.log
    path_key            path
    multiline.parser    cri
    db                  /buffer/@NODE_ID@/pods.db
    inotify_watcher     false
    refresh_interval    10
    rotate_wait         30
    buffer_chunk_size   16k
    buffer_max_size     16k
    truncate_long_lines on
    mem_buf_limit       8MB
    storage.type        filesystem
@APP_LOGS_INPUT@
[INPUT]
    name                tail
    tag                 host.file
    path                @INSTALL_DIR@/logs/k3s.log,@INSTALL_DIR@/logs/bootstrap.log,@INSTALL_DIR@/logs/gvisor-smoke.log
    path_key            file
    db                  /buffer/@NODE_ID@/host.db
    inotify_watcher     false
    refresh_interval    10
    rotate_wait         30
    buffer_chunk_size   16k
    buffer_max_size     16k
    truncate_long_lines on
    mem_buf_limit       8MB
    storage.type        filesystem

# Kernel messages and Runtime's own units; K3s writes to logs/k3s.log instead.
[INPUT]
    name                systemd
    tag                 host.journal
    db                  /buffer/@NODE_ID@/journal.db
    read_from_tail      on
    strip_underscores   on
    systemd_filter_type or
    systemd_filter      _TRANSPORT=kernel
    systemd_filter      _SYSTEMD_UNIT=livepeer-k3s.service
    systemd_filter      _SYSTEMD_UNIT=livepeer-firewall.service
    systemd_filter      _SYSTEMD_UNIT=livepeer-secrets-expiry.service
    storage.type        filesystem

[INPUT]
    name                kubernetes_events
    tag                 event
    db                  /buffer/@NODE_ID@/events.db
    storage.type        filesystem

[FILTER]
    name                parser
    match               pod.*
    key_name            path
    parser              pod_log_path
    reserve_data        on

[FILTER]
    name                modify
    match               pod.*
    rename              log message
    remove              _p
    remove              time

[FILTER]
    name                modify
    match               pod.system
    add                 source system

[FILTER]
    name                modify
    match               pod.app
    add                 source app

[FILTER]
    name                throttle
    match               pod.app
    rate                200
    window              5
    interval            1s

[FILTER]
    name                modify
    match               host.file
    rename              log message
    add                 source host

[FILTER]
    name                modify
    match               host.journal
    rename              MESSAGE message
    add                 source host

[FILTER]
    name                record_modifier
    match               host.journal
    allowlist_key       message
    allowlist_key       source
    allowlist_key       SYSTEMD_UNIT
    allowlist_key       SYSLOG_IDENTIFIER
    allowlist_key       PRIORITY
    allowlist_key       TRANSPORT

[FILTER]
    name                nest
    match               event
    operation           lift
    nested_under        involvedObject
    add_prefix          object_

[FILTER]
    name                modify
    match               event
    rename              object_namespace namespace
    rename              object_name object
    add                 source event

[FILTER]
    name                record_modifier
    match               event
    allowlist_key       message
    allowlist_key       source
    allowlist_key       namespace
    allowlist_key       object
    allowlist_key       object_kind
    allowlist_key       reason
    allowlist_key       type
    allowlist_key       count

[OUTPUT]
    name                     http
    match                    *
    host                     127.0.0.1
    port                     20244
    uri                      /logs/insert
    format                   json_lines
    json_date_key            time
    json_date_format         iso8601
    compress                 gzip
    retry_limit              no_limits
    storage.total_limit_size 128M
    workers                  1
