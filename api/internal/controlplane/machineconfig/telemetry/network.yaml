# Agents listen only on the Pod loopback; nothing may connect to them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: livepeer-telemetry-agent, namespace: livepeer-telemetry}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress: []
---
# Only the agent's vmagent may scrape node_exporter.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: livepeer-telemetry-node-exporter, namespace: livepeer-telemetry}
spec:
  podSelector: {matchLabels: {app: livepeer-telemetry-node-exporter}}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector: {matchLabels: {app: livepeer-telemetry-agent}}
    ports: [{protocol: TCP, port: 9100}]
