[INPUT]
    name                tail
    tag                 pod.app
    path                @INSTALL_DIR@/logs/pods/livepeer-apps_*/*/*.log
    path_key            path
    multiline.parser    cri
    db                  /buffer/fluent-bit/apps.db
    inotify_watcher     false
    refresh_interval    10
    rotate_wait         30
    buffer_chunk_size   16k
    buffer_max_size     16k
    truncate_long_lines on
    mem_buf_limit       8MB
    storage.type        filesystem
