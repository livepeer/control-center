# Read-only access for kubelet metrics, cluster object state and events.
apiVersion: v1
kind: ServiceAccount
metadata: {name: livepeer-telemetry-agent, namespace: livepeer-telemetry}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: livepeer-telemetry-agent}
rules:
- apiGroups: ['']
  resources: [nodes, pods, namespaces, events]
  verbs: [get, list, watch]
- apiGroups: ['']
  resources: [nodes/metrics]
  verbs: [get]
- apiGroups: [apps]
  resources: [deployments, daemonsets, replicasets]
  verbs: [list, watch]
- apiGroups: [events.k8s.io]
  resources: [events]
  verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: livepeer-telemetry-agent}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: livepeer-telemetry-agent}
subjects: [{kind: ServiceAccount, name: livepeer-telemetry-agent, namespace: livepeer-telemetry}]
