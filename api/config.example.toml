# Copy to config.toml in this directory. Create secrets/ with mode 0700 and
# secret files with mode 0600. Values must not have a trailing newline.
# Paths here are relative to this config file.
# Put the PostgreSQL URI and its password in these files.
PGConnstrFile = "secrets/pg-connstr"
# Required for [YOUR-PASSWORD] or [PG_PASSWORD] in the URI; omit if it already
# contains an encoded password. Connections require TLS (not sslmode=prefer).
PGPasswordFile = "secrets/pg-password"

SupabaseURL = "https://PROJECT.supabase.co"
# Browser-public publishable key, never a service-role key.
SupabasePublishableKey = "replace-with-publishable-key"

# Optional. Seed one pending administrator grant only if no active grants exist.
# Enable Confirm Email and establish safe account verification history first;
# see docs/operations.md. This does not create credentials or replace grants.
# DefaultAdminEmail = "admin@example.com"

# Generate each once: openssl rand -hex 32 | tr -d '\n'
# Keep stable. Changing MachineTokenSecret invalidates installed credentials.
JWTSigningSecretFile = "secrets/jwt-signing-secret"
MachineTokenSecretFile = "secrets/machine-token-secret"

Listen = "localhost:41932"
# Remote bootstrap hosts AND their Kubernetes pods must reach this URL.
# Put the API behind a reachable HTTPS endpoint for remote machines.
PublicAPIURL = "http://localhost:41932"
ConfigReconcileInterval = "1m"

# Registry price validation only; actual Node payment configuration is separate.
RegistryPaymentMode = "offchain"

# Machine ingress is opt-in. See docs/machine-tunnels.md before enabling it.
CloudflareEnabled = false
CloudflareIngressApproved = false
# The following are operator decisions; placeholders are intentionally invalid.
# CloudflareAccountID = "<ACCOUNT_ID>"
# CloudflareZoneID = "<ZONE_ID>"
# CloudflareBaseDomain = "<BASE_DOMAIN>"
# CloudflareTeamName = "<ZERO_TRUST_TEAM>"
# CloudflareAPITokenFile = "secrets/cloudflare-provisioning-token"
# CloudflareKeyringFile = "secrets/collector-access-keyring.json"
# CloudflareConnectorImage = "<REGISTRY>/livepeer-tunnel@sha256:<IMAGE_DIGEST>"
# CloudflareAccessLifetime = "<TOKEN_LIFETIME>"
# CloudflareRotateBefore = "<ROTATION_WINDOW>"
# TunnelStatusTTL = "<OBSERVATION_TTL>" # at least 2m; longer than both poll loops
# TunnelDrainTimeout = "<DRAIN_DEADLINE>"
# TunnelNodeAddresses = ["<NODE_OR_MANAGEMENT_IP/CIDR>"] # complete fleet inventory
# TunnelPrivateControlCIDRs = ["<PRIVATE_CONTROL_CENTER_IP/32>"] # if needed
