apiVersion: v1
kind: Pod
metadata:
  name: livepeer-gvisor-smoke
  namespace: livepeer
  labels:
    livepeer.io/runner-control: 'true'
    app: livepeer-gvisor-smoke
spec:
  runtimeClassName: gvisor
  dnsPolicy: None
  dnsConfig: {nameservers: [1.1.1.1, 1.0.0.1]}
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
  - name: smoke
    image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    command:
    - sh
    - -ec
    - |
      dmesg | grep -q 'Starting gVisor'
      for attempt in $(seq 1 20); do
        if nslookup example.com &&
          wget -T 3 --no-check-certificate -qO- https://example.com >/dev/null; then
          echo gvisor-ok
          exit 0
        fi
        sleep 2
      done
      exit 1
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        memory: 128Mi
