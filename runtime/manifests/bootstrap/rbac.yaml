apiVersion: v1
kind: ServiceAccount
metadata:
  name: livepeer-http-source
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: livepeer-http-source
  namespace: flux-system
rules:
- apiGroups: [kustomize.toolkit.fluxcd.io]
  resources: [kustomizations]
  resourceNames: [livepeer, livepeer-upgrade-plan, livepeer-node, livepeer-connector, livepeer-app-reconciler, livepeer-upgrade-controller]
  verbs: [get]
- apiGroups: [kustomize.toolkit.fluxcd.io]
  resources: [kustomizations]
  resourceNames: [livepeer]
  verbs: [patch]
- apiGroups: [apps]
  resources: [deployments]
  resourceNames: [livepeer-tunnel, livepeer-app-reconciler]
  verbs: [get]
- apiGroups: ['']
  resources: [configmaps]
  resourceNames: [livepeer-tunnel]
  verbs: [get]
- apiGroups: ['']
  resources: [services]
  resourceNames: [livepeer-app-reconciler]
  verbs: [get]
- apiGroups: [networking.k8s.io]
  resources: [networkpolicies]
  resourceNames: [livepeer-tunnel, livepeer-app-reconciler]
  verbs: [get]
- apiGroups: ['']
  resources: [pods]
  verbs: [get, list]
- apiGroups:
  - source.toolkit.fluxcd.io
  resources:
  - externalartifacts
  resourceNames:
  - livepeer-service
  verbs:
  - get
- apiGroups:
  - source.toolkit.fluxcd.io
  resources:
  - externalartifacts/status
  resourceNames:
  - livepeer-service
  verbs:
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: livepeer-http-source
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: livepeer-http-source
subjects:
- kind: ServiceAccount
  name: livepeer-http-source
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: livepeer-applied-reader
  namespace: livepeer
rules:
- apiGroups: [apps]
  resources: [deployments]
  resourceNames: [orchestrator]
  verbs: [get]
- apiGroups: ['']
  resources: [configmaps, services, persistentvolumeclaims]
  resourceNames: [orchestrator]
  verbs: [get]
- apiGroups: ['']
  resources: [configmaps]
  resourceNames: [livepeer-app-assignments]
  verbs: [get]
- apiGroups: [networking.k8s.io]
  resources: [networkpolicies]
  resourceNames: [orchestrator-private]
  verbs: [get]
- apiGroups: ['']
  resources: [pods]
  verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: livepeer-applied-reader
  namespace: livepeer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: livepeer-applied-reader
subjects:
- kind: ServiceAccount
  name: livepeer-http-source
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: livepeer-runtime-observe
rules:
- apiGroups: ['']
  resources: [nodes]
  verbs: [list]
- apiGroups: ['']
  resources: [namespaces]
  resourceNames: [livepeer, system-upgrade]
  verbs: [get]
- apiGroups: ['']
  resources: [persistentvolumes]
  resourceNames: [livepeer-orchestrator]
  verbs: [get]
- apiGroups: [apiextensions.k8s.io]
  resources: [customresourcedefinitions]
  resourceNames: [plans.upgrade.cattle.io]
  verbs: [get]
- apiGroups: [rbac.authorization.k8s.io]
  resources: [clusterroles]
  resourceNames: [system-upgrade-controller, system-upgrade-controller-drainer]
  verbs: [get]
- apiGroups: [rbac.authorization.k8s.io]
  resources: [clusterrolebindings]
  resourceNames: [system-upgrade, system-upgrade-drainer]
  verbs: [get]
# The namespace is created by the managed bundle, so use narrowly named cluster
# rules rather than a bootstrap Role in a namespace that may not exist yet.
- apiGroups: ['']
  resources: [serviceaccounts]
  resourceNames: [system-upgrade]
  verbs: [get]
- apiGroups: ['']
  resources: [configmaps]
  resourceNames: [default-controller-env]
  verbs: [get]
- apiGroups: [apps]
  resources: [deployments]
  resourceNames: [system-upgrade-controller]
  verbs: [get]
- apiGroups: [rbac.authorization.k8s.io]
  resources: [roles]
  resourceNames: [system-upgrade-controller]
  verbs: [get]
- apiGroups: [rbac.authorization.k8s.io]
  resources: [rolebindings]
  resourceNames: [system-upgrade]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: livepeer-runtime-observe
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: livepeer-runtime-observe
subjects:
- kind: ServiceAccount
  name: livepeer-http-source
  namespace: flux-system
