apiVersion: v1
kind: ServiceAccount
metadata:
  name: livepeer-http-source
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: livepeer-http-source
  namespace: flux-system
rules:
- apiGroups: [kustomize.toolkit.fluxcd.io]
  resources: [kustomizations]
  resourceNames: [livepeer, livepeer-upgrade-plan]
  verbs: [get]
- apiGroups: [apps]
  resources: [deployments]
  resourceNames: [livepeer-tunnel]
  verbs: [get]
- apiGroups: ['']
  resources: [pods]
  verbs: [list]
- apiGroups:
  - source.toolkit.fluxcd.io
  resources:
  - externalartifacts
  resourceNames:
  - livepeer-service
  verbs:
  - get
- apiGroups:
  - source.toolkit.fluxcd.io
  resources:
  - externalartifacts/status
  resourceNames:
  - livepeer-service
  verbs:
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: livepeer-http-source
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: livepeer-http-source
subjects:
- kind: ServiceAccount
  name: livepeer-http-source
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: livepeer-applied-reader
  namespace: livepeer
rules:
- apiGroups: [apps]
  resources: [deployments]
  resourceNames: [orchestrator]
  verbs: [get]
- apiGroups: ['']
  resources: [pods]
  verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: livepeer-applied-reader
  namespace: livepeer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: livepeer-applied-reader
subjects:
- kind: ServiceAccount
  name: livepeer-http-source
  namespace: flux-system
