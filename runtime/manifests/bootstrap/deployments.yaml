apiVersion: apps/v1
kind: Deployment
metadata:
  name: livepeer-http-source
  namespace: flux-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: livepeer-http-source
  template:
    metadata:
      labels:
        app: livepeer-http-source
    spec:
      nodeSelector: {livepeer.io/node-id: '@NODE_ID@'}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: livepeer-http-source
        image: '@RUNTIME_IMAGE@'
        command: [/usr/local/bin/livepeer-runtime, http-source]
        args:
        - --directory
        - /artifacts
        - --url
        - '@CONFIG_URL@'
        - --token-file
        - /credentials/token
        - --identity-file
        - /credentials/identity.json
        - --transport
        - '@CONTROL_TRANSPORT@'
        - --artifact-url
        - http://livepeer-http-source.flux-system.svc.cluster.local:8080
        - --socket-root
        - /management
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef: {fieldPath: spec.nodeName}
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: credential
          mountPath: /credentials
          readOnly: true
        - name: artifacts
          mountPath: /artifacts
          readOnly: false
        - name: installed-software
          mountPath: /installed-software
          readOnly: true
        - name: management
          mountPath: /management
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
      volumes:
      - name: credential
        secret:
          secretName: livepeer-service-auth
          defaultMode: 288
      - name: artifacts
        hostPath:
          path: '@INSTALL_DIR@/volumes/http-source'
          type: Directory
      - name: installed-software
        hostPath:
          path: '@INSTALL_DIR@/volumes/installed-software'
          type: DirectoryOrCreate
      - name: management
        hostPath:
          path: '@INSTALL_DIR@/volumes/management-sockets'
          type: Directory
      serviceAccountName: livepeer-http-source
