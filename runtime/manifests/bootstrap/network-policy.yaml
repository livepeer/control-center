apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-livepeer-http
  namespace: flux-system
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - livepeer-http-source
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 8080
