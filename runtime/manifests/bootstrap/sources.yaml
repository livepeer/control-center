apiVersion: source.toolkit.fluxcd.io/v1
kind: ExternalArtifact
metadata:
  name: livepeer-service
  namespace: flux-system
spec: {}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: livepeer
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 5m
  path: ./
  prune: true
  deletionPolicy: Orphan
  wait: true
  sourceRef:
    kind: ExternalArtifact
    name: livepeer-service
